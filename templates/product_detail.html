<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>

    <style>

        body{
            font-family:Arial;
            background:#f3f4f6;
            padding:40px;
        }

        .card{
            max-width:900px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:15px;
            display:flex;
            gap:30px;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        img{
            width:350px;
            height:250px;
            object-fit:cover;
            border-radius:10px;
        }

        .details{
            flex:1;
        }

        .price{
            color:#2563eb;
            font-size:28px;
            font-weight:bold;
            margin:15px 0;
        }

        .category{
            display:inline-block;
            background:#dbeafe;
            color:#1e40af;
            padding:6px 12px;
            border-radius:20px;
            margin-bottom:20px;
        }

        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            cursor:pointer;
        }

    </style>
</head>

<body>

<div class="card">

    <img src="{{ product.image.url }}">

    <div class="details">

        <span class="category">
            {{ product.category }}
        </span>

        <h1>{{ product.name }}</h1>

        <div class="price">
            ₹{{ product.price }}
        </div>

        <p>{{ product.description }}</p>

        <a href="/add-to-cart/{{ product.id }}/">

            <button>
                Add To Cart
            </button>

        </a>

    </div>

</div>

</body>
</html>
