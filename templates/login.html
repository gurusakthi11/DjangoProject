<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <style>

        body{
            font-family:Arial;
            background:#f3f4f6;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .form-box{
            background:white;
            padding:40px;
            width:350px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            background:#111827;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
        }

    </style>

</head>

<body>

    <div class="form-box">

        <h2>Login</h2>

        <form method="POST">

    {% csrf_token %}

            <input type="text" name="username" placeholder="Username">

            <input type="password" name="password" placeholder="Password">

            <button type="submit">

                Login

            </button>

        </form>

    </div>

</body>

</html>
